# Runs on every push and pull request: Python tests, UI tests and build, and the browser test.
# No model is needed: the backend tests use a scripted fake LLM and the browser test uses the mock backend.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json
      - working-directory: frontend/ui
        run: npm ci --no-audit --no-fund
      - name: UI tests
        working-directory: frontend/ui
        run: npm test
      - name: UI build (type check + bundle)
        working-directory: frontend/ui
        run: npm run build

      - name: Browser test
        working-directory: frontend/ui
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/ui/playwright-report/
          retention-days: 7
