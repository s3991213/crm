# Eval cases for the CRM Assistant agent.
#
# Each case is one staff request (or a short conversation: earlier turns go in `before`).
# `expect` describes the reply to the final message:
#   type        reply type, or a list of acceptable types
#   student     name on the student card (null = no card)
#   tools       tools that must have been called;  not_tools: tools that must not be called
#   update      {student, field, new_value} of the staged change
#   draft_to    address of the email draft
#   text_has    words that must appear in the reply text (case-insensitive)
#   no_saved_claim  the text must not claim something was saved or sent
#   text_lacks  words that must not appear in the reply text
#   sources     a policy section the answer must cite
# `judge` (optional, beside `expect`): what a good reply must say, for open-ended text. An LLM judge scores the
# reply against it once the exact checks pass, and fails it for missing points or invented facts.
# Every case also checks that no student record was written: only a staff click on Confirm may do that.

# --- lookup ---------------------------------------------------------------
- id: lookup-first-name
  category: lookup
  message: find Liam
  expect: {type: answer, student: Liam Nguyen, tools: [find_student]}

- id: lookup-full-name-lowercase
  category: lookup
  message: show me mei chen's record
  expect: {type: answer, student: Mei Chen}

- id: lookup-apostrophe
  category: lookup
  message: Look up Grace O'Brien
  expect: {type: answer, student: Grace O'Brien}

- id: lookup-question-about-field
  category: lookup
  message: What course is Omar doing?
  expect: {type: answer, student: Omar Haddad, text_has: [Hospitality]}

- id: lookup-payment-question
  category: lookup
  message: Has Lucas paid his fees?
  expect: {type: answer, student: Lucas Silva, text_has: [overdue]}

- id: lookup-typo-surname
  category: lookup
  message: find Sofia Martines
  expect: {type: answer, student: Sofia Martinez}

- id: lookup-surname-only
  category: lookup
  message: pull up Becker
  expect: {type: answer, student: Tom Becker}

- id: lookup-no-punctuation
  category: lookup
  message: whats lucas silvas status
  expect: {type: answer, student: Lucas Silva, text_has: [active]}

- id: lookup-attendance
  category: lookup
  message: how is Hana's attendance looking?
  expect: {type: answer, student: Hana Sato, text_has: ["79"]}

- id: lookup-indirect-status
  category: lookup
  message: is Aisha's visa sorted yet?
  expect: {type: answer, student: Aisha Rahman, text_has: [pending]}

# --- history --------------------------------------------------------------
- id: history-summary
  category: history
  message: summarise Sofia's history
  expect: {type: answer, student: Sofia Martinez, tools: [get_history], text_has: [visa]}
  judge: >-
    Summarises Sofia Martinez's notes: she applied in August, her visa application was lodged on 2 October,
    her attendance has dipped this month, and she mentioned a part-time job.

- id: history-casual
  category: history
  message: what's been happening with Arjun lately?
  expect: {type: answer, student: Arjun Patel, text_has: [portal]}
  judge: >-
    Says Arjun Patel hasn't logged into the student portal for about a month. May mention he started in June and
    had strong first-term results.

- id: history-background
  category: history
  message: give me the background on Grace before I call her
  expect: {type: answer, student: Grace O'Brien, tools: [get_history], update: null}
  judge: >-
    Tells staff Grace O'Brien deferred in August for family reasons and plans to return next February.

