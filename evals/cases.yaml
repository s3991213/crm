# --- drafts ---------------------------------------------------------------
- id: draft-overdue
  category: draft
  message: draft a follow-up email for Liam about his overdue payment
  expect: {type: draft_email, draft_to: liam.nguyen@example.com, tools: [draft_email]}
  judge: >-
    The email draft is a polite reminder to Liam that his second instalment is overdue (about three weeks), asks him
    to pay or get in touch (for example about a payment plan), and is signed by the staff member, Eval Staff.
    It doesn't threaten or invent amounts, dates or penalties.

- id: draft-check-in
  category: draft
  message: write a quick check-in email to Omar
  expect: {type: draft_email, draft_to: omar.haddad@example.com}
  judge: >-
    The email draft is a short, friendly check-in with Omar, asking how he is going and offering help, signed by
    Eval Staff. It doesn't invent problems with his record.

- id: draft-typo-name
  category: draft
  message: write an email to Omr Hadad reminding him about orientation
  # Asking "did you mean Omar Haddad?" is right too; a draft to anyone else is not.
  expect: {type: [draft_email, clarify], update: null}

# --- clarify (ask, don't guess) --------------------------------------------
- id: clarify-no-student
