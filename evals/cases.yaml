  expect: {type: confirm_update, update: {student: Priya Sharma, field: Status, new_value: Deferred}}

- id: multi-three-turns
  category: multi-turn
  before: ["who's most at risk?", "tell me more about the top one"]
  message: draft them a supportive email
  expect: {type: draft_email, draft_to: sofia.m@example.com}

- id: multi-ambiguous-after-at-risk
  category: multi-turn
