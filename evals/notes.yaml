# Student notes search eval: does a question like "who mentioned a part-time job?" find the right notes?
# Run: python -m evals.notes_retrieval   (needs the embedding model in LM Studio)
#
# The generated notes (college_db/generate.py) come from a few fixed sentences, so every part-time job is "Has
# started a part-time job in hospitality." and a keyword search can't miss. These notes are written the way staff
# write instead: shorthand, everyday words, the same thing said in different ways. They're mixed into the generator's
# routine notes (offers, orientation, payments), with every generated sentence that could answer a question left out,
# so the labels below are the only right answers. Written by me, so they carry my idea of how staff write.
#
# Each note's id is the student's first name and its number. A question's `want` is every note that answers it;
# `none` questions have no answer at all (to see whether a score cut-off could say "nobody").

